spring:
  application:
    name: skalez
  profiles:
    active: local
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  # DB 스키마는 Flyway 마이그레이션(src/main/resources/db/migration/V{번호}__{설명}.sql)으로만 바꾼다.
  # 서버가 뜰 때 아직 적용되지 않은 파일을 번호 순서로 실행하고 flyway_schema_history 테이블에 기록한다.
  # 이미 적용된 파일은 고치지 말고 새 번호 파일을 추가한다
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Hibernate는 테이블을 만들거나 고치지 않는다. 엔티티와 실제 테이블이 어긋나면 서버가 뜨지 않는다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # 연관 데이터를 100개씩 묶어서 조회 (N+1 쿼리 방지)
        default_batch_fetch_size: 100

# 비밀 값은 운영에서 반드시 환경변수로 넣는다. 없으면 서버가 뜨지 않는다 (실수로 기본값을 쓰는 사고 방지)
skalez:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 2h
  crypto:
    aes-key: ${AES_KEY}
  # 첫 관리자 계정. 서버가 뜰 때 이 이메일 계정이 없으면 만든다. 계정이 생긴 뒤에는 비워 둬도 된다
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: 관리자
  # 브라우저(FE)에서 API를 부를 수 있는 주소. 쉼표로 여러 개, * 패턴 가능 (예: https://skalez-*.vercel.app).
  # 관리자 페이지가 다른 도메인이면 환경변수 CORS_ALLOWED_ORIGINS에 함께 넣는다
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://skalez.com,https://www.skalez.com}
  # 고객이 보는 쇼핑몰 주소 (메일 속 링크용)
  site:
    url: ${SITE_URL:https://skalez.com}
  # 메일: log(로컬, 로그에만 남김) | smtp(AWS SES 등). SMTP 접속 정보는 spring.mail.* 환경변수로
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:no-reply@skalez.com}
    from-name: SKALEZ
  # 간편 로그인 키 (비어 있으면 그 로그인은 꺼짐). Redirect URI 는 {SITE_URL}/api/auth/oauth/{kakao|naver}/callback
  oauth:
    fake: false
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
  # 결제 PG 선택: nice(나이스페이먼츠) | fake(로컬 가짜 결제) | portone(해외용, 연동 전)
  payment:
    provider: ${PAYMENT_PROVIDER:nice}
    nice:
      client-key: ${NICEPAY_CLIENT_KEY:}
      secret-key: ${NICEPAY_SECRET_KEY:}
      api-url: ${NICEPAY_API_URL:https://api.nicepay.co.kr}
      # 결제 처리 후 고객을 돌려보낼 FE 페이지
      result-redirect-url: ${PAYMENT_RESULT_URL:https://skalez.com/order/result}

---
# 운영. SPRING_PROFILES_ACTIVE=prod 로 실행한다.
# 필수 환경변수: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, AES_KEY, NICEPAY_CLIENT_KEY, NICEPAY_SECRET_KEY
# 선택: ADMIN_EMAIL / ADMIN_PASSWORD (첫 관리자), CORS_ALLOWED_ORIGINS, PAYMENT_RESULT_URL
# 메일(SES SMTP): SPRING_MAIL_HOST=email-smtp.ap-northeast-2.amazonaws.com, SPRING_MAIL_PORT=587,
#   SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD (SES SMTP 자격 증명), MAIL_FROM(인증된 발신 주소), SITE_URL
# 간편 로그인: KAKAO_CLIENT_ID / KAKAO_CLIENT_SECRET, NAVER_CLIENT_ID / NAVER_CLIENT_SECRET (없으면 버튼만 '준비 중')
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # PostgreSQL. 예: jdbc:postgresql://db.internal:5432/skalez
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
# 운영 메일은 SMTP(SES)가 기본 — 로컬처럼 로그에 재설정 링크를 남기지 않는다
skalez:
  mail:
    provider: ${MAIL_PROVIDER:smtp}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # 메모리 H2를 PostgreSQL 호환 모드로. Flyway 마이그레이션도 여기서 그대로 실행돼 운영 SQL이 깨지면 로컬에서 먼저 드러난다
    url: jdbc:h2:mem:skalez;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    show-sql: true

# 로컬 전용 값. 운영 키로 절대 쓰지 말 것
skalez:
  jwt:
    secret: local-only-secret-change-me-0123456789abcdef
  crypto:
    aes-key: bG9jYWwtb25seS1hZXMta2V5LWNoYW5nZS1tZS0zMmI=
  admin:
    email: admin@skalez.local
    password: local-admin-pass-1234
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:3010,https://skalez-*.vercel.app}
  site:
    url: ${SITE_URL:http://localhost:3010}
  # 로컬: 키가 없으면 시험용 간편 로그인으로 흐름만 확인 (진짜 카카오·네이버 창은 안 뜸)
  oauth:
    fake: true
  # 로컬은 기본 가짜 결제. 나이스페이 샌드박스로 해보려면 PAYMENT_PROVIDER=nice + 샌드박스 키 환경변수로 실행
  payment:
    provider: ${PAYMENT_PROVIDER:fake}
    nice:
      api-url: ${NICEPAY_API_URL:https://sandbox-api.nicepay.co.kr}
      result-redirect-url: ${PAYMENT_RESULT_URL:http://localhost:3010/order/result}
